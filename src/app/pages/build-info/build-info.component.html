<article class="t-page fastfetch">
  <pre class="ff-logo cp437 desktop-only" role="img" aria-label="JW logo">{{ logo.text() }}</pre>
  <pre class="ff-logo cp437 mobile-only" role="img" aria-label="JW logo">{{ logoSmall.text() }}</pre>
  <div class="ff-info">
    <p class="ff-title"><span class="k">guest</span>&#64;<span class="k">jaxon.dev</span></p>
    <p class="ff-rule" aria-hidden="true">{{ '─'.repeat(15) }}</p>
    @for (f of fields(); track f.key) {
      <p class="ff-line"><span class="k">{{ f.key }}</span>: @if (f.link) {<a [href]="f.link" target="_blank" rel="noopener">{{ f.value }}</a>} @else {{{ f.value }}}</p>
    }
    <div class="ff-colors" aria-label="Theme palette">
      @for (row of palette(); track $index) {
        <div class="ff-row cp437">@for (c of row; track $index) {<span [style.color]="c">███</span>}</div>
      }
    </div>
  </div>
</article>
