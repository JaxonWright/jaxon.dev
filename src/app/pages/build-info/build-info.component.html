<article class="t-page">
  <p>jaxon.dev {{version.raw}} angular-{{dependencies[0].version}} {{buildDate}}</p>
  <h1>Build Info</h1>
  <table>
    @for (dep of buildInfo; track $index) {
      <tr><td class="muted">{{dep.name}}</td><td>@if (dep.link) {<a [href]="dep.link" target="_blank" rel="noopener">{{dep.version}}</a>} @else {{{dep.version}}}</td></tr>
    }
  </table>
  <h1>Dependencies</h1>
  <table>
    @for (dep of dependencies; track $index) {
      <tr><td class="muted">{{dep.name}}</td><td><a [href]="dep.link" target="_blank" rel="noopener">{{dep.version}}</a></td></tr>
    }
  </table>
</article>
