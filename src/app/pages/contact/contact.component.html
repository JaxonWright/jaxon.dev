<article class="t-page">
  <h1>Contact</h1>
  <table>
    @for (l of contact; track l.name) {
      <tr><td class="muted">{{l.name}}</td><td><a [href]="l.href" [attr.target]="l.href.startsWith('mailto') ? null : '_blank'" rel="noopener">{{l.label}}</a></td></tr>
    }
  </table>
  <h1 id="pay">Pay</h1>
  <table>
    @for (l of pay; track l.name) {
      <tr><td class="muted">{{l.name}}</td><td><a [href]="l.href" target="_blank" rel="noopener">{{l.label}}</a></td></tr>
    }
  </table>
</article>
