name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # version.js runs git describe, which needs tags and history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node version.js
      - run: npm test -- --watch=false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run test:scripts
      - run: npx ng build --configuration production
